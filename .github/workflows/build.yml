name: Build AstralCord

# Every push to main builds AstralCord for Windows (portable zip + installer) and Linux
# (AppImage), then publishes them as a nightly GitHub pre-release tagged
# v1.0.0-nightly.<UTC date>.<run number>. Installed copies of AstralCord check these releases and
# update themselves (the Windows zip/installer and the AppImage).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: astralcord-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The app and the AppImage take their update source from this (apps/desktop/src/updater.rs).
  ASTRALCORD_REPO: ${{ github.repository }}
  SEREIN_CHANNEL: nightly
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: echo "version=1.0.0-nightly.$(date -u +%Y%m%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows (x64)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Apply version
        run: python .github/release/version.py "$VERSION"
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Build and package
        run: cargo xtask package
      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $asset = "astralcord-v$env:VERSION-Windows-X64"
          Compress-Archive -Path "dist/*" -DestinationPath "release-assets/$asset.zip"
          $installer = Get-ChildItem -Path "dist-installer/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not built" }
          Copy-Item -LiteralPath $installer.FullName -Destination "release-assets/$asset-Setup.exe"
          Get-ChildItem release-assets
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: windows
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux (AppImage, x86_64)
    needs: version
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 150
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SEREIN_RELEASE_TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          bash packaging/linux/install-build-deps.sh
          apt-get install -y --no-install-recommends zsync
      - name: Apply version
        run: python3 .github/release/version.py "$VERSION"
      - name: Create unprivileged builder
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Build AppImage (voice included)
        run: |
          chown -R builder:builder /home/builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env HOME=/home/builder ASTRALCORD_REPO="$ASTRALCORD_REPO" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" SEREIN_CHANNEL="$SEREIN_CHANNEL" \
            SEREIN_RELEASE_TAG="$SEREIN_RELEASE_TAG" CARGO_TERM_COLOR=always bash <<'BUILD'
            set -eu
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            rustup show active-toolchain
            bash packaging/appimage/install-tools.sh
            cargo xtask package --format appimage
          BUILD
      - name: Collect AppImage
        run: |
          mkdir release-assets
          set -- dist/astralcord-*-Linux-X64.AppImage
          test "$#" -eq 1
          test -f "$1"
          test -s "$1.zsync"
          cp "$1" "$1.zsync" release-assets/
          ls -la release-assets
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: linux
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish nightly release
    needs: [version, windows, linux]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Checksums (the in-app updater verifies downloads against these)
        working-directory: release-assets
        run: sha256sum ./* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish pre-release
        run: |
          cat > notes.md <<EOF
          AstralCord nightly built from ${GITHUB_SHA::7}.

          **Windows 10/11 (x64)**
          - \`astralcord-$TAG-Windows-X64-Setup.exe\` (installer, recommended)
          - \`astralcord-$TAG-Windows-X64.zip\` (portable: unzip and run \`astralcord.exe\`)

          **Linux (x86_64, any distro)**
          - \`astralcord-$TAG-Linux-X64.AppImage\`: \`chmod +x\` it and run it. It needs GTK 4 and WebKitGTK 6.0 from your distro.

          AstralCord updates itself from these releases.
          EOF
          gh release create "$TAG" release-assets/* --prerelease --title "AstralCord $TAG" --notes-file notes.md --target "$GITHUB_SHA"
