name: Build AstralCord

# Every push to main builds AstralCord for Linux and Windows, then publishes the
# files as a GitHub Release named after the version in src-tauri/tauri.conf.json
# (e.g. v7.0.1). Pushing again with the same version replaces that release's files.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  GIT_HASH: ${{ github.sha }}
  # The app and its updater check this repo's Releases for new versions
  # (see src-tauri/src/release.rs and updater/src/github.rs).
  ASTRALCORD_REPO: ${{ github.repository }}

jobs:
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
        with:
          target: x86_64-unknown-linux-gnu

      - name: Install JS dependencies
        run: pnpm install && pnpm shupdate

      # Compiles the app (downloading the CEF/Chromium runtime it needs for voice),
      # stages CEF via scripts/bundle-cef.sh, then packages the .deb.
      - name: Build app and .deb
        run: pnpm tauri build -c src-tauri/tauri.linux.conf.json --bundles deb --target x86_64-unknown-linux-gnu -- --config target.x86_64-unknown-linux-gnu.linker=\'x86_64-linux-gnu-gcc\'
        env:
          RUSTFLAGS: -Awarnings -C link-arg=-Wl,--disable-new-dtags -C link-arg=-Wl,-rpath,$ORIGIN -C link-arg=-Wl,-rpath,$ORIGIN/../lib/astralcord

      - name: Package portable .tar.gz
        run: |
          [ -f src-tauri/.cef/libcef.so ] || bash scripts/bundle-cef.sh
          cd src-tauri/target/x86_64-unknown-linux-gnu/release
          mkdir -p plugins themes
          touch .portable
          rm -rf locales
          cp -af ../../../.cef/. .
          tar -czvf AstralCord_linux_x64_portable.tar.gz AstralCord .portable ./plugins ./themes ./injection ./icons libcef.so libEGL.so libGLESv2.so chrome_100_percent.pak chrome_200_percent.pak resources.pak icudtl.dat v8_context_snapshot.bin chrome-sandbox locales

      - uses: actions/upload-artifact@v7
        with:
          name: linux-portable
          path: src-tauri/target/x86_64-unknown-linux-gnu/release/AstralCord_linux_x64_portable.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: linux-deb
          path: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
        with:
          target: x86_64-pc-windows-msvc

      - name: Install JS dependencies
        run: pnpm install && pnpm shupdate

      - name: Build updater
        run: pnpm build:updater
        env:
          RUSTFLAGS: -Awarnings

      - name: Build app and installers
        run: pnpm tauri build --bundles nsis,msi --target x86_64-pc-windows-msvc
        env:
          RUSTFLAGS: -Awarnings

      - name: Package portable .zip
        shell: bash
        run: |
          cd src-tauri/target/x86_64-pc-windows-msvc/release
          mkdir -p plugins themes
          touch .portable
          7z a -tzip -mx9 AstralCord_win64_portable.zip AstralCord.exe updater.exe .portable plugins/ themes/ icons/ injection/ extension/

      - uses: actions/upload-artifact@v7
        with:
          name: windows-portable
          path: src-tauri/target/x86_64-pc-windows-msvc/release/AstralCord_win64_portable.zip

      - uses: actions/upload-artifact@v7
        with:
          name: windows-nsis
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

      - uses: actions/upload-artifact@v7
        with:
          name: windows-msi
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi

  release:
    name: Publish GitHub Release
    needs: [linux, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          V=$(jq -r .version src-tauri/tauri.conf.json)
          TAG="v$V"
          mkdir out
          cp artifacts/windows-nsis/*.exe        "out/AstralCord_${V}_x64-setup.exe"
          cp artifacts/windows-msi/*.msi         "out/AstralCord_${V}_x64_en-US.msi"
          cp artifacts/windows-portable/*.zip    "out/AstralCord_${V}_win64_portable.zip"
          cp artifacts/linux-portable/*.tar.gz   "out/AstralCord_${V}_linux_x64_portable.tar.gz"
          cp artifacts/linux-deb/*.deb           "out/AstralCord_${V}_amd64.deb"
          ls -la out

          cat > notes.md <<EOF
          Built from ${GITHUB_SHA::7}.

          **Windows 10/11**
          - \`AstralCord_${V}_x64-setup.exe\` (installer, recommended)
          - \`AstralCord_${V}_x64_en-US.msi\` (MSI installer)
          - \`AstralCord_${V}_win64_portable.zip\` (no install: unzip and run \`AstralCord.exe\`)

          **Linux (x86_64)**
          - \`AstralCord_${V}_linux_x64_portable.tar.gz\` (any distro, including Arch: extract and run \`./AstralCord\`)
          - \`AstralCord_${V}_amd64.deb\` (Debian/Ubuntu/Mint)

          AstralCord is a fork of [Dorion](https://github.com/SpikeHD/Dorion) by SpikeHD, licensed under GPL-3.0.
          EOF

          # One release per version: replace it if this version was already published.
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" out/* --title "AstralCord $TAG" --notes-file notes.md --target "$GITHUB_SHA" --latest
